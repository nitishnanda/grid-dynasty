<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Ladder</title>
<meta name="theme-color" content="#14120e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apex Ladder">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--paper:#ece3cf;--paper2:#f8f1e1;--ink:#14120e;--ink2:#5a5244;--org:#ff5b1f;--blue:#1f4bff;--grn:#0d8a4f;--red:#d4183d;--yel:#ffcf33;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.45}
body{background-image:linear-gradient(rgba(20,18,14,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(20,18,14,.06) 1px,transparent 1px);background-size:22px 22px}
#app{max-width:520px;margin:0 auto;padding:0 14px 130px}
#app.tall{padding-bottom:270px}
.bar{position:sticky;top:0;z-index:5;margin:0 -14px 14px;background:var(--ink);color:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:9px 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.bar b{font-family:var(--serif);font-size:17px;letter-spacing:.02em;text-transform:none}
.bar span{opacity:.9}
h1{font-family:var(--serif);font-size:38px;line-height:1;margin:6px 0 8px;letter-spacing:-.02em}
h2{font-family:var(--serif);font-size:24px;margin:0 0 6px;line-height:1.1}
h3{font-family:var(--serif);font-size:22px;margin:0;line-height:1.1}
p{margin:0 0 10px}
.lede{color:var(--ink2);margin:0 0 16px;font-size:14px}
.cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px;font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sheet{background:var(--paper2);border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:14px;margin:0 0 18px}
.sheet.flat{box-shadow:none}
.sheet.hl{background:var(--yel)}
.step{display:flex;gap:8px;align-items:baseline;margin:16px 0 8px}.step i{font-style:normal;font-weight:900;background:var(--ink);color:var(--paper);padding:1px 6px;font-size:12px}.step b{font-size:12px;letter-spacing:.14em;text-transform:uppercase}
input,select{width:100%;font:inherit;font-size:16px;background:var(--paper2);color:var(--ink);border:2.5px solid var(--ink);padding:12px;border-radius:0;margin:0 0 4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 6px}.tiles.three{grid-template-columns:repeat(3,1fr)}.tiles.five{grid-template-columns:1fr 1fr}
.tile{position:relative;border:2.5px solid var(--ink);background:var(--paper2);padding:10px;cursor:pointer;min-height:58px}
.tile b{display:block;font-size:14px}.tile span{display:block;font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.3}
.tile.on{background:var(--org);box-shadow:3px 3px 0 var(--ink)}.tile.on span{color:var(--ink)}
.tile.on::after{content:"✓";position:absolute;top:4px;right:8px;font-weight:900}
.btn{display:block;width:100%;font:inherit;font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase;background:var(--paper2);color:var(--ink);border:2.5px solid var(--ink);padding:13px;cursor:pointer;text-align:center;margin:0 0 9px;box-shadow:4px 4px 0 var(--ink);border-radius:0}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--org)}.btn.dark{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
.btn.sm{padding:10px;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row .btn{margin:0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:3px solid var(--ink);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.dock>div{max-width:520px;margin:0 auto}
.dock .btn{margin-bottom:8px}.dock .btn:last-child{margin-bottom:0}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:2.5px solid var(--ink);margin:0 0 6px}
.modes div{padding:9px 4px;text-align:center;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-right:2.5px solid var(--ink);background:var(--paper2)}
.modes div:last-child{border-right:0}.modes div.on{background:var(--ink);color:var(--paper)}.modes div.on.push{background:var(--org);color:var(--ink)}.modes div.on.coast{background:var(--blue);color:#fff}
.mdesc{font-size:11px;color:var(--ink2);margin:0 0 8px;line-height:1.3}
.strip{display:grid;grid-template-columns:repeat(4,1fr);border:2.5px solid var(--ink);background:var(--paper2);margin:0 0 10px}
.strip div{padding:8px 6px;border-right:2.5px solid var(--ink);text-align:center}.strip div:last-child{border-right:0}
.strip b{display:block;font-size:24px;line-height:1.1;font-family:var(--serif)}.strip span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.team{display:flex;align-items:stretch;border:2.5px solid var(--ink);background:var(--paper2);margin:0 0 10px}
.team .sw{width:16px;flex:none;border-right:2.5px solid var(--ink)}.team .tx{padding:8px 10px;flex:1}.team .tx>b{font-family:var(--serif);font-size:19px}.team .tx .meta b{font-family:var(--mono);font-size:inherit}.team .rn{padding:8px 10px;border-left:2.5px solid var(--ink);text-align:center;font-weight:800;background:var(--ink);color:var(--paper)}
.meta{font-size:11.5px;color:var(--ink2);margin:0 0 10px;display:flex;flex-wrap:wrap;gap:4px 12px}.meta b{color:var(--ink)}
.rd{border:2.5px solid var(--ink);background:var(--paper2);margin:0 0 12px}
.rdh{display:flex;gap:8px;align-items:baseline;background:var(--ink);color:var(--paper);padding:6px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}.rdh b{font-size:15px;color:var(--yel)}.rdh em{margin-left:auto;font-style:normal;opacity:.85;font-size:10.5px}
table{width:100%;border-collapse:collapse}
.ts td{padding:5px 10px;border-top:1px solid rgba(20,18,14,.25);font-size:13px}.ts tr:first-child td{border-top:0}
.ts td.k{width:62px;font-size:10.5px;letter-spacing:.1em;color:var(--ink2);font-weight:700}.ts td.r{text-align:right}.ts td.g{color:var(--ink2)}
.ts tr.w td{background:var(--yel)}.ts tr.d td{background:#f6c9d2;color:var(--red)}.ts tr.pd td:nth-child(2){font-weight:900}
.rc{padding:12px 14px}.rcr{margin:10px 0}.rch{display:flex;justify-content:space-between;font-weight:700;font-size:13px}.rch b{font-family:var(--mono)}.rcb{height:7px;background:var(--paper2);border:1.5px solid var(--ink);margin:4px 0}.rcb i{display:block;height:100%;background:var(--org)}.rcr small{display:block;font-size:11.5px;opacity:.8;line-height:1.35}.gA{color:#0d8a4f}.gB{color:#4a7a1f}.gD,.gE{color:#d4183d}
.note{border:2.5px dashed var(--ink);background:var(--paper2);padding:9px 11px;margin:0 0 12px;font-size:13px}
.tbl th{background:var(--ink);color:var(--paper);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;text-align:right;padding:6px 8px;font-weight:700}.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(20,18,14,.25);text-align:right;font-size:13px}.tbl td.l,.tbl th.l{text-align:left}
.tbl tr.me td{background:var(--yel);font-weight:800}
.tbl small{color:var(--ink2);font-size:11px}
.you{display:inline-block;background:var(--org);border:2px solid var(--ink);font-size:10px;font-weight:900;padding:0 4px;margin-left:6px;letter-spacing:.08em}
.up{color:var(--grn);font-weight:800}.dn{color:var(--red);font-weight:800}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.meter{display:grid;grid-template-columns:44px 1fr 30px;gap:8px;align-items:center;margin:5px 0;font-size:12px;font-weight:700}
.meter .bl{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}.meter .bl i{height:12px;border:1.5px solid var(--ink);background:transparent}.meter .bl i.f{background:var(--ink)}.meter .bl.hi i.f{background:var(--org)}.meter .bl.mid i.f{background:var(--blue)}.meter .bl.lo i.f{background:var(--red)}
.meter b{text-align:right;font-size:14px}
.id{display:flex;gap:12px;align-items:stretch;margin:0 0 12px}
.ovr{width:82px;flex:none;background:var(--org);border:2.5px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-weight:900;line-height:1}.ovr small{font-family:var(--mono);font-size:10px;letter-spacing:.14em;margin-top:4px}
.stamp{display:inline-block;border:2.5px solid;padding:2px 8px;font-weight:900;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-2.5deg);background:var(--paper2)}
.memo{background:#fff6b8;border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:16px 14px 12px;margin:6px 0 20px;position:relative;transform:rotate(-.6deg)}
.memo::before{content:"";position:absolute;top:-12px;left:42%;width:70px;height:22px;background:rgba(255,91,31,.55);border:1.5px solid var(--ink);transform:rotate(3deg)}
.memo .hd{font-size:11px;letter-spacing:.12em;text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:6px;margin:0 0 10px}.memo p{font-size:14px;margin:0 0 9px}
.stamps{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.offer{position:relative;border:2.5px solid var(--ink);background:var(--paper2);margin:0 0 12px;cursor:pointer}
.offer .oh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:8px 10px;border-bottom:2.5px solid var(--ink)}.offer .oh b{font-family:var(--serif);font-size:19px}.offer .oh em{font-style:normal;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:2px 6px;white-space:nowrap}
.offer .og{display:grid;grid-template-columns:repeat(3,1fr)}.offer .og div{padding:7px 10px;border-right:1.5px solid rgba(20,18,14,.3);font-size:11px;color:var(--ink2)}.offer .og div:last-child{border-right:0}.offer .og b{display:block;color:var(--ink);font-size:14px}
.offer .ot{padding:6px 10px;border-top:1.5px solid rgba(20,18,14,.3);font-size:12px;color:var(--ink2)}
.offer.on{background:#ffd9c7;box-shadow:5px 5px 0 var(--ink)}.offer.on::after{content:"SELECTED";position:absolute;top:-10px;right:10px;background:var(--org);border:2px solid var(--ink);font-size:10px;font-weight:900;letter-spacing:.12em;padding:1px 6px}
.offer.blocked{opacity:.5;cursor:not-allowed;border-style:dashed}
.sim{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.sim div{border:2.5px solid var(--ink);background:var(--paper2);text-align:center;padding:8px 2px;cursor:pointer;font-size:10.5px;letter-spacing:.1em;font-weight:800}.sim div b{display:block;font-family:var(--serif);font-size:21px;letter-spacing:0}.sim div.on{background:var(--org);box-shadow:3px 3px 0 var(--ink)}
.modalbg{position:fixed;inset:0;z-index:20;background:rgba(20,18,14,.7);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.modal{background:var(--paper);border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink);padding:16px;width:100%;max-width:480px;margin:auto}
.modal h2{font-size:26px}
.cards{display:flex;gap:10px;margin:12px 0}.pcard{flex:1;aspect-ratio:3/4;border:3px solid var(--ink);background:var(--ink);color:var(--paper);font:900 15px var(--mono);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:4px 4px 0 var(--org);cursor:pointer;transition:transform .5s}.pcard b{font-size:34px;color:var(--org)}.pcard.flip{transform:rotateY(180deg) scale(1.04)}.pcard:disabled{opacity:.7}
.lg{margin:0 0 10px}.lg .it{display:grid;grid-template-columns:16px 1fr;gap:2px 10px;padding:7px 0;border-top:1px solid rgba(20,18,14,.3);font-size:12px}.lg i{width:14px;height:14px;border:2px solid var(--ink);margin-top:2px}.lg b{font-size:13px}.lg span{color:var(--ink2);display:block;line-height:1.35}.lg .gd{color:var(--grn)}.lg .bd{color:var(--red)}
.big{font-family:var(--serif);font-size:96px;line-height:.95;font-weight:900;margin:2px 0}
.kv{display:grid;grid-template-columns:repeat(3,1fr);border:2.5px solid var(--ink);margin:0 0 12px;background:var(--paper2)}.kv div{padding:8px 10px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}.kv div:nth-child(3n){border-right:0}.kv div:nth-last-child(-n+3){border-bottom:0}.kv b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink);letter-spacing:0;text-transform:none}
.chip{display:inline-block;border:2px solid var(--ink);background:var(--paper2);padding:2px 8px;margin:0 6px 6px 0;font-size:12px;font-weight:700}
.sc{overflow-x:auto}
.tbl .sh td{background:var(--ink);color:var(--paper);text-align:left;border-bottom:0;padding:8px 8px}.tbl .sh small{color:#cfc7b3}.tbl tbody.sb{border-top:3px solid var(--ink)}.tbl td.gp{font-size:12px;color:var(--ink2)}.tbl tr.me td.gp{color:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>
<script src="f1-data.js"></script>
<script src="f1-engine.js"></script>
<script>
(function(){
const E=window.F1E, D=window.F1D, CATS=D.CATS, NATS=D.NATS;
const KEY='apexLadder_v1',OLDKEY='gridDynasty_v1';
let G=null;
const ui={screen:'start',name:'',nat:'GB',arch:'allround',startAge:7,tierSel:'',wealthSel:'',modal:null,sel:-1,train:null,acad:false,spin:null,wheelRes:null,wlist:null};
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=k=>k>=1000?'£'+(k/1000).toFixed(k>=10000?0:1)+'M':'£'+Math.round(k)+'k';
const ord=n=>n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');
const ARCH=[['allround','All-rounder','Balanced across the board'],['qualifier','Qualifier','One-lap pace'],['racer','Racer','Racecraft, tyre care'],['wet','Rain master','Wet-weather specialist']];
const teamColor=n=>{for(const [k,c] of D.TEAM_COLORS)if(String(n).includes(k))return c;let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h},70%,52%)`;};

function save(){try{if(G)localStorage.setItem(KEY,JSON.stringify(G));}catch(e){}}
function load(){try{let s=localStorage.getItem(KEY);if(!s){s=localStorage.getItem(OLDKEY);}const g=s?JSON.parse(s):null;return g&&g.v===2?(E.migrate?E.migrate(g):g):null;}catch(e){return null;}}
function clear(){try{localStorage.removeItem(KEY);}catch(e){}}
const stamp=(txt,col)=>`<span class="stamp" style="color:${col};border-color:${col}">${esc(txt)}</span>`;
const tierStamp=t=>{const T=D.TIERS[t];return stamp(T.n,T.id==='gen'?'#c2185b':T.id==='wonder'?'#a86f00':T.id==='late'?'#c24a00':T.id==='talented'?'#1f4bff':'#5a5244');};
const fmtGap=c=>c.status==='next'?'':(c.lead?'+'+c.gap+' on P2':'−'+c.gap+' to P1');
function compBlock(comp){
  return `<div class="cap">Competitions this season</div><div class="sheet flat" style="padding:0"><table class="tbl"><tr><th class="l">Competition</th><th>Rds</th><th>Pos</th><th>Pts</th><th>Gap</th></tr>${comp.map(c=>`<tr class="${c.status==='live'?'me':''}"><td class="l">${esc(c.n)}${c.main?' ★':''}${c.status==='final'?' ✓':''}</td><td>${c.done}/${c.total}</td><td>${c.status==='next'?'–':c.pos+'/'+c.N}</td><td>${c.status==='next'?'–':c.pts}</td><td class="gp">${fmtGap(c)}</td></tr>`).join('')}</table></div>`;
}
function sponsorCards(){
  const M=G.market; if(!M||!M.sponsors||!M.sponsors.length) return '';
  return `<div class="cap">Sponsor approaches</div>`+M.sponsors.map((s,i)=>`<div class="offer" data-act="spon" data-i="${i}"><div class="oh"><b>${esc(s.name)}</b><em>Sponsor</em></div><div class="og"><div>cash now<b>${money(s.cash)}</b></div><div>funding<b>×${s.mult}</b></div><div>term<b>${s.years} yr</b></div></div><div class="ot">Tap to sign. Cash joins your family purse and sponsor funding rises while the deal lasts.</div></div>`).join('');
}
function bar(){return `<div class="bar"><b>Apex Ladder</b><span>${G&&G.phase!=='retired'&&ui.screen!=='start'?`AGE ${G.age} · ${G.year} · REP ${Math.round(G.rep)}`:'career sim'}</span></div>`;}
function meters(st){return D.STATS.map(k=>{const v=st[k],n=Math.round(v/10),cls=v>=85?'hi':v>=70?'mid':v<55?'lo':'';return `<div class="meter"><span>${k}</span><div class="bl ${cls}">${Array.from({length:10},(_,i)=>`<i class="${i<n?'f':''}"></i>`).join('')}</div><b>${v}</b></div>`;}).join('');}
const sim=()=>D.STATS.map(k=>`<div data-act="train" data-k="${k}" class="${ui.train===k?'on':''}">${k}<b>${G.stats[k]}</b></div>`).join('');

/* ---------- screens ---------- */
function vStart(){
  const sv=load();
  return `${bar()}<h1>Apex Ladder</h1><p class="lede">Build a racing career from the karting paddock to a grand prix seat. Every result, contract and sponsor decision is yours.</p>
  <div class="step"><i>01</i><b>Driver</b></div><input id="nm" placeholder="Driver name" maxlength="24" value="${esc(ui.name)}">
  <div class="step"><i>02</i><b>Driving style</b></div><div class="tiles">${ARCH.map(a=>`<div class="tile ${ui.arch===a[0]?'on':''}" data-act="arch" data-v="${a[0]}"><b>${a[1]}</b><span>${a[2]}</span></div>`).join('')}</div>
  <div class="step"><i>03</i><b>Start point</b></div><div class="tiles"><div class="tile ${ui.startAge===7?'on':''}" data-act="sa" data-v="7"><b>Full journey</b><span>Karting at age 7 (2026). The world evolves around you.</span></div><div class="tile ${ui.startAge===16?'on':''}" data-act="sa" data-v="16"><b>Fast track</b><span>British F4 at 16, real 2026 grids.</span></div></div>
  <div class="step"><i>04</i><b>Talent tier</b></div><div class="tiles">${[['','Random','Realistic odds']].concat(D.TIERS.map((t,i)=>[String(i),t.n,''])).map(([v,n,s])=>`<div class="tile ${ui.tierSel===v?'on':''}" data-act="ts" data-v="${v}"><b>${n}</b>${s?`<span>${s}</span>`:''}</div>`).join('')}</div>
  <div class="step"><i>05</i><b>Family wealth</b></div><div class="tiles">${[['','Random'],['poor','Poor'],['middle','Middle class'],['rich','Rich parents'],['dynasty','Old money']].map(([v,n])=>`<div class="tile ${ui.wealthSel===v?'on':''}" data-act="ws" data-v="${v}"><b>${n}</b></div>`).join('')}</div>
  <div class="step"><i>06</i><b>Nationality</b></div><select id="nat">${Object.keys(NATS).map(k=>`<option value="${k}" ${ui.nat===k?'selected':''}>${NATS[k].f} ${NATS[k].n}</option>`).join('')}</select>
  <div style="height:16px"></div>
  ${sv?`<button class="btn go" data-act="cont">Resume ${esc(sv.name)} · age ${sv.age} · ${esc(CATS[sv.cat].short)}</button>`:''}
  <button class="btn ${sv?'':'go'}" data-act="new">Open new driver file</button>`;
}
function vIntro(){
  const C=CATS[G.cat], ov=E.ovrOf(G.stats);
  return `${bar()}<h1>Driver file</h1><p class="lede">${G.age===7?'Age 7. '+esc(NATS[G.nat].n)+'. A kart and a lot to prove.':'Age 16. '+esc(NATS[G.nat].n)+'. British F4 rookie, '+G.year+'.'}</p>
  <div class="sheet"><div class="id"><div class="ovr">${ov}<small>RTG</small></div><div><h3>${esc(G.name)}</h3><div class="meta" style="margin:4px 0 8px"><span>${NATS[G.nat].f} age ${G.age}</span><span>${esc(E.WEALTH[G.wealth].n)}</span></div>${tierStamp(G.tier)}</div></div>
  <p class="meta" style="margin:0 0 10px">${esc(D.TIERS[G.tier].blurb)}</p>${meters(G.stats)}<p class="meta" style="margin:10px 0 0">Talent tier is locked for the whole career. Reshuffling only moves your attributes around.</p></div>
  <div class="sheet flat"><div class="cap">First seat</div><h2>${esc(G.team)}</h2><div class="meta"><span>${esc(C.name)}</span><span>seat <b>${money(G.deal.cost)}/yr</b></span><span>family funds <b>${money(G.family)}</b></span></div>

    const r=ui.wheelRes, L=ui.wlist||[];
    const stageName=G.S.spins===0?'Early-season briefing':'Late-season briefing';
    if(r) return `<div class="modalbg"><div class="modal"><div class="cap">${r.good>0?'Good news':'Bad news'}</div><h2>${r.icon} ${esc(r.title)}</h2><div class="note"><b>Effect:</b> ${esc(r.fx)}</div>${r.extra&&r.extra.kind==='standin'?`<table class="tbl"><tr><th class="l">F1 grand prix</th><th>Result</th><th>Pts</th></tr>${r.extra.rows.map(x=>`<tr><td class="l">${esc(x.gp)}</td><td>${x.dnf?'DNF':'P'+x.pos}</td><td>${x.pts}</td></tr>`).join('')}</table><div style="height:10px"></div>`:''}${r.extra&&r.extra.kind==='fp1'?`<table class="tbl"><tr><th class="l">F1 FP1 · ${esc(r.extra.gp)}</th><th>Result</th><th>Rep</th></tr><tr><td class="l">Friday practice</td><td>P${r.extra.pos}</td><td>+${r.extra.rep}</td></tr></table><div style="height:10px"></div>`:''}<p>${esc(r.desc)}</p><button class="btn go" data-act="wdone">Back to the paddock ▶</button></div></div>`;
    const tot=L.reduce((a,o)=>a+o.w,0);
    return `<div class="modalbg"><div class="modal"><div class="cap">Stage ${G.S.spins+1} of 3 complete</div><h2>${stageName}</h2><p class="lede" style="margin-bottom:0">Draw one of three sealed cards for a random twist, or skip it. Good and bad outcomes carry equal weight.</p><div class="cards">${['Radio','Garage','Paddock'].map((n,k)=>`<button class="pcard ${ui.spin===k?'flip':''}" data-act="spin" data-k="${k}" ${ui.spin!=null&&ui.spin!==false?'disabled':''}><b>?</b>${n}</button>`).join('')}</div>
    <button class="btn" data-act="skipw" ${ui.spin!=null&&ui.spin!==false?'disabled':''}>Skip</button>
    <div class="cap" style="margin-top:8px">What the cards can hold</div><div class="lg">${L.map(o=>`<div class="it"><i style="background:${o.col}"></i><div><b>${o.ic} ${esc(o.t)} · ${(100*o.w/tot).toFixed(o.w<1?1:0)}% <small class="${o.g>0?'gd':'bd'}">${o.g>0?'GOOD':'BAD'}</small></b><span>${esc(o.fx)}</span></div></div>`).join('')}</div></div></div>`;
  }
  return '';
}

/* ---------- render / events ---------- */
let lastKey='';
function render(forceTop){
  let h='';
  const ph=G?G.phase:null;
  const key=(ui.screen==='start'||!G)?'start':ph;
  if(key==='start') h=vStart(); else if(ph==='intro') h=vIntro(); else if(ph==='season') h=vSeason(); else if(ph==='wrap') h=vWrap(); else if(ph==='market') h=vMarket(); else if(ph==='retired') h=vRetired();
  const y0=window.scrollY, h0=document.documentElement.scrollHeight;
  $.className=(key==='season'||key==='wrap'||key==='market'||key==='intro')?'tall':'';
  $.innerHTML=h;
  document.body.style.overflow=ui.modal?'hidden':'';
  if(forceTop||key!==lastKey) window.scrollTo(0,0);
  else{
    // keep whatever you were looking at: new results are added above, so push the view down by the same amount
    const dh=Math.max(0,document.documentElement.scrollHeight-h0);
    window.scrollTo(0, y0>30 ? y0+dh : y0);
  }
  lastKey=key;
}
const rerender=()=>render();

function afterRound(){ if(G.S.wheelDue){ui.modal='wheel';ui.spin=null;ui.wheelRes=null;ui.wlist=E.wheelList(G);} }
document.addEventListener('input',e=>{if(e.target.id==='nm')ui.name=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='nat')ui.nat=e.target.value;});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  if(e.target.closest('[data-stop]') && el.classList.contains('modalbg'))return;
  const a=el.dataset.act;
  switch(a){
    case 'arch': ui.arch=el.dataset.v; rerender(); return;
    case 'sa': ui.startAge=+el.dataset.v; rerender(); return;
    case 'ts': ui.tierSel=el.dataset.v; rerender(); return;
    case 'ws': ui.wealthSel=el.dataset.v; rerender(); return;
    case 'mode': E.setMode(G,el.dataset.v); save(); rerender(); return;
    case 'new': G=E.newGame({name:ui.name.trim()||'Driver',nat:ui.nat,arch:ui.arch,startAge:ui.startAge,tier:ui.tierSel===''?null:+ui.tierSel,wealth:ui.wealthSel||null}); ui.screen='game'; ui.modal=null; save(); render(true); return;
    case 'cont': G=load(); if(G){ui.screen='game';ui.modal=null; if(G.phase==='season')afterRound(); render(true);} return;
    case 'home': ui.screen='start'; ui.modal=null; render(true); return;
    case 'rs': E.rerollStats(G); save(); rerender(); return;
    case 'rc': E.rerollClub(G); save(); rerender(); return;
    case 'begin': E.startSeason(G); save(); render(true); return;
    case 'tbl': case 'drv': case 'cars': ui.modal=a; rerender(); return;
    case 'close': ui.modal=null; rerender(); return;
    case 'next': E.playRound(G); afterRound(); save(); render(); return;
    case 'sim': E.simToEnd(G); afterRound(); save(); render(); return;
    case 'spin': {
      const res=E.spinWheel(G); ui.spin=+(el.dataset.k||0); save(); rerender();
      setTimeout(()=>{ui.wheelRes=res;ui.spin=null;rerender();},900); return; }
    case 'skipw': E.skipWheel(G); ui.modal=null; save(); rerender(); return;
    case 'wdone': ui.modal=null; ui.wheelRes=null; if(G.pendingEnd){E.endCareerNow(G);save();render(true);return;} rerender(); return;
    case 'wrap': ui.train=null; E.finishSeason(G); save(); render(true); return;
    case 'cont2': E.continueContract(G,ui.train); ui.sel=-1; ui.train=null; save(); render(true); return;
    case 'plan': G.phase='market'; ui.sel=-1; ui.train=null; ui.acad=false; save(); render(true); return;
    case 'noop': return;
    case 'stev': ui.stEv=+el.dataset.i; rerender(); return;
    case 'spon': E.takeSponsor(G,+el.dataset.i); save(); rerender(); return;
    case 'sel': ui.sel=el.dataset.i==='ret'?'ret':+el.dataset.i; rerender(); return;
    case 'acad': ui.acad=!ui.acad; rerender(); return;
    case 'train': ui.train=ui.train===el.dataset.k?null:el.dataset.k; rerender(); return;
    case 'go':
      if(ui.sel==='ret'){E.retire(G);} else { E.chooseOption(G,ui.sel,ui.train,ui.acad); if(G.age>=E.MAX_AGE) E.retire(G); }
      ui.sel=-1; ui.train=null; ui.acad=false; save(); render(true); return;
    case 'again': clear(); G=null; ui.screen='start'; render(true); return;
  }
});
render(true);
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
