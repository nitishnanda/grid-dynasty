<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grid Dynasty</title>
<meta name="theme-color" content="#0b0c14">
<style>
:root{--bg:#0b0c14;--card:#151625;--card2:#1b1c30;--bd:#2a2c4a;--tx:#eceefb;--mu:#8b8fb0;--gr:#1fbf75;--gd:#ffd23f;--rd:#ff4d6d;--or:#ff8a5c;--pk:#ff6fae}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;min-height:100%}
body{background:radial-gradient(900px 500px at 50% -10%,#0f2b1f 0,transparent 70%),var(--bg);background-attachment:fixed}
#app{max-width:480px;margin:0 auto;padding:16px 16px 140px}
h1{font-size:30px;margin:18px 0 6px;text-align:center;letter-spacing:-.5px}
h2{font-size:20px;margin:0 0 10px}
.sub{color:var(--mu);text-align:center;font-size:15px;line-height:1.4;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:0 0 14px}
.lab{font-size:12px;letter-spacing:.12em;color:var(--mu);font-weight:700;text-transform:uppercase;margin:0 0 8px}
.top{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}
.pill{border:1.5px solid #5c4f1c;background:#1a1810;color:var(--gd);border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px}
.pill.u{border-color:var(--bd);background:var(--card);color:var(--tx);font-weight:700;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:block;width:100%;border:1.5px solid var(--bd);background:var(--card2);color:var(--tx);border-radius:16px;padding:16px;font-size:17px;font-weight:800;text-align:center;cursor:pointer;margin:0 0 10px;font-family:inherit}
.btn.g{background:linear-gradient(#1fbf75,#13935a);border-color:#1fbf75;color:#04170d;box-shadow:0 0 28px #1fbf7533}
.btn.g:disabled,.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn.s{padding:13px;font-size:15px}
.btn.back{display:inline-block;width:auto;padding:10px 16px;font-size:15px;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 8px;text-align:center}
.tile b{display:block;font-size:24px;margin-top:4px}
.tile span{font-size:10px;letter-spacing:.1em;color:var(--mu);font-weight:700;text-transform:uppercase}
.tile i{display:block;font-size:11px;color:var(--mu);font-style:normal;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:700;color:var(--mu)}
.chip b{color:var(--tx)}.chip.g{background:linear-gradient(#1fbf75,#13935a);color:#04170d;border-color:#1fbf75}.chip.g b{color:#04170d}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.row2 .btn{margin:0;font-size:16px}
.log{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.log .r{font-size:12px;color:var(--mu);font-weight:800}
.log .t{font-weight:700}.log .d{font-size:13px;color:var(--mu);grid-column:2}
.badge{border-radius:10px;padding:7px 10px;font-weight:800;font-size:15px;min-width:48px;text-align:center;background:#23253f}
.badge.w{background:#3a2f0b;color:var(--gd)}.badge.p{background:#12301f;color:var(--gr)}.badge.x{background:#3a1420;color:var(--rd)}
.fixed{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);}
.fixed>div{max-width:480px;margin:0 auto}
.modalbg{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;overflow:auto}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:20px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
.modal h2{text-align:center;font-size:26px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:11px;letter-spacing:.1em;color:var(--mu);text-align:right;padding:8px 6px;font-weight:700;text-transform:uppercase}th:first-child,td:first-child{text-align:left}
td{padding:11px 6px;border-top:1px solid var(--bd);text-align:right;white-space:nowrap}
td.l,th.l{text-align:left;white-space:normal}
tr.me td{background:#12301f;font-weight:800}
tr.z td:first-child{border-left:3px solid var(--gr)}
.small{font-size:13px;color:var(--mu)}
.ovr{width:74px;height:74px;border:3px solid var(--gr);border-radius:18px;background:#0f2b1f;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;font-weight:900;flex:none;box-shadow:0 0 22px #1fbf7544}
.ovr small{font-size:11px;color:var(--gr);letter-spacing:.12em}
.pro{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.pro h3{margin:0;font-size:22px}.tag{display:inline-block;margin-top:6px;border-radius:999px;background:#23253f;color:var(--pk);font-weight:800;padding:6px 12px;font-size:14px}
.sbar{display:grid;grid-template-columns:44px 1fr 32px;gap:10px;align-items:center;margin:9px 0;font-size:14px;font-weight:800;color:var(--mu)}
.sbar .tr{height:9px;background:#272942;border-radius:9px;overflow:hidden}.sbar .tr i{display:block;height:100%;border-radius:9px}
.sbar b{color:var(--tx);text-align:right;font-size:16px}
input,select{width:100%;background:var(--card);border:1.5px solid var(--bd);border-radius:16px;color:var(--tx);padding:16px;font-size:17px;font-family:inherit;margin-bottom:14px}
.arch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.arch div{background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:12px;cursor:pointer}
.arch div.on{border-color:var(--gr);background:#0f2b1f}.arch b{display:block;margin-bottom:3px}.arch span{font-size:12px;color:var(--mu)}
.opt{border:1.5px solid var(--bd);background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 8px}
.opt.on{border:2px dashed var(--gr);background:#0f2b1f}.opt b.t{font-size:19px}.opt .m{font-size:13px;color:var(--mu);grid-column:1}.opt .dl{grid-row:1/3;grid-column:2;align-self:center;font-weight:900;font-size:18px;color:var(--gr)}
.opt .dl.n{color:var(--rd)}.opt .ro{grid-column:1;font-size:14px;color:var(--mu)}
.rp{display:inline-block;background:#23253f;border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px;color:var(--tx);margin-left:6px}
.opt.dis{opacity:.45;cursor:default}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tg div{background:var(--card2);border:1.5px solid var(--bd);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;color:var(--mu);font-size:12px;font-weight:800}
.tg div b{display:block;font-size:22px;color:var(--tx);margin-top:3px}.tg div.on{border-color:var(--gr);background:#0f2b1f}.tg div.on b{color:var(--gr)}
.big{font-size:92px;line-height:1;font-weight:900;color:var(--gd);text-align:center;margin:12px 0 4px}
.cen{text-align:center}.gold{color:var(--gd)}
.tro{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.tro span{border:1.5px solid #6b5a1b;border-radius:999px;padding:9px 14px;font-weight:800;font-size:14px}
.box3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.box3 div{background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--mu);font-weight:700}.box3 b{display:block;font-size:24px;color:var(--tx);margin-top:4px}
.note{border-radius:14px;padding:12px 14px;background:#1a1810;border:1px solid #5c4f1c;color:#f3deb1;margin-bottom:12px;font-size:14px;line-height:1.4}
.news{display:grid;grid-template-columns:1fr auto;padding:9px 0;border-top:1px solid var(--bd);gap:2px 10px;font-size:15px}.news:first-of-type{border-top:0}.news span:first-child{color:var(--mu)}.news span:last-child{font-weight:800;text-align:right}
.up{color:var(--gr);font-weight:800}.dn{color:var(--rd);font-weight:800}
@keyframes spin{to{transform:rotate(1080deg)}}.wheel{font-size:84px;text-align:center;display:block;margin:10px auto}.wheel.sp{animation:spin 1.1s cubic-bezier(.2,.7,.2,1)}
.sc{overflow-x:auto}
.pie{width:100%;max-width:300px;display:block;margin:6px auto 12px}
.lg{display:grid;grid-template-columns:14px 1fr;gap:3px 10px;margin:0 0 12px;font-size:13px}
.lg i{width:12px;height:12px;border-radius:4px;margin-top:3px}.lg b{font-size:14px}.lg span{color:var(--mu);display:block;line-height:1.35}
.tierb{display:inline-block;border-radius:999px;padding:6px 12px;font-weight:900;font-size:14px;border:1.5px solid}
.sel2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.sel2 div{background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:12px;cursor:pointer}.sel2 div.on{border-color:var(--gr);background:#0f2b1f}.sel2 b{display:block;margin-bottom:3px}.sel2 span{font-size:12px;color:var(--mu)}
.fx{border-radius:14px;background:var(--card2);border:1px solid var(--bd);padding:12px 14px;font-size:14px;line-height:1.45;margin:0 0 14px;color:var(--mu)}.fx b{color:var(--tx)}
</style>
</head>
<body>
<div id="app"></div>
<script src="f1-data.js"></script>
<script src="f1-engine.js"></script>
<script>
(function(){
const E=window.F1E, D=window.F1D, CATS=D.CATS, NATS=D.NATS;
const KEY='gridDynasty_v1';
let G=null;
const ui={screen:'start',name:'',nat:'GB',arch:'allround',startAge:7,modal:null,sel:-1,train:null,acad:false,spin:null,wheelRes:null,wlist:null};
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=k=>k>=1000?'£'+(k/1000).toFixed(k>=10000?0:1)+'M':'£'+Math.round(k)+'k';
const bar=v=>v>=85?'#1fbf75':v>=65?'#ffd23f':v>=55?'#ff8a5c':'#ff4d6d';
const ord=n=>n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');
const ARCH=[['allround','All-rounder','Balanced across the board'],['qualifier','Qualifier','One-lap pace, saturday hero'],['racer','Racer','Racecraft and tyre management'],['wet','Rain master','Wet-weather wizard']];

function save(){try{if(G)localStorage.setItem(KEY,JSON.stringify(G));}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);const g=s?JSON.parse(s):null;return g&&g.v===2?g:null;}catch(e){return null;}}
const tierBadge=t=>{const T=D.TIERS[t];return `<span class="tierb" style="color:${T.col};border-color:${T.col}55;background:${T.col}18">${T.n}</span>`;};
function clear(){try{localStorage.removeItem(KEY);}catch(e){}}

function top(){return `<div class="top"><div class="pill">⭐ ${G?Math.round(G.rep):'-'} rep</div><div class="pill u">🏁 ${esc(G?G.name:'Grid Dynasty')}</div></div>`;}
function bars(st){return D.STATS.map(k=>`<div class="sbar"><span>${k}</span><div class="tr"><i style="width:${st[k]}%;background:${bar(st[k])}"></i></div><b>${st[k]}</b></div>`).join('');}

/* ---------- screens ---------- */
function vStart(){
  const sv=load();
  return `<h1>🏎️ Grid Dynasty</h1><p class="sub">Start in karting at 7. Climb F4, F3 and F2. Fight for a grand prix seat, then chase the world title.</p>
  <div class="lab">Driver name</div><input id="nm" placeholder="Your name" maxlength="24" value="${esc(ui.name)}">
  <div class="lab">Driving style</div><div class="arch">${ARCH.map(a=>`<div data-act="arch" data-v="${a[0]}" class="${ui.arch===a[0]?'on':''}"><b>${a[1]}</b><span>${a[2]}</span></div>`).join('')}</div>
  <div class="lab">Start point</div><div class="sel2"><div data-act="sa" data-v="7" class="${ui.startAge===7?'on':''}"><b>Full journey</b><span>Karting at age 7 (2026). The world evolves around you.</span></div><div data-act="sa" data-v="16" class="${ui.startAge===16?'on':''}"><b>Fast track</b><span>Join British F4 at 16 and race the real 2026 grids.</span></div></div>
  <div class="lab">Nationality</div><select id="nat">${Object.keys(NATS).map(k=>`<option value="${k}" ${ui.nat===k?'selected':''}>${NATS[k].f} ${NATS[k].n}</option>`).join('')}</select>
  ${sv?`<button class="btn g" data-act="cont">Continue career</button>`:''}
  <button class="btn ${sv?'':'g'}" data-act="new">Start new career</button>
  ${sv?`<p class="small cen">Saved: ${esc(sv.name)}, age ${sv.age}, ${esc(CATS[sv.cat].short)}</p>`:''}`;
}
function vIntro(){
  const C=CATS[G.cat], ov=E.ovrOf(G.stats);
  return `<button class="btn back" data-act="home">‹ Menu</button><h1>Your story begins</h1><p class="sub">${G.age===7?'A 7-year-old '+esc(NATS[G.nat].n)+' karter with everything to prove.':'A 16-year-old '+esc(NATS[G.nat].n)+' F4 rookie in '+G.year+'.'}</p>
  <div class="card"><div class="pro"><div class="ovr">${ov}<small>OVR</small></div><div><h3>${esc(G.name)}</h3><div class="small">${NATS[G.nat].f} age ${G.age} · ${esc(G.team)}</div>${tierBadge(G.tier)}</div></div><p class="small" style="margin:0 0 8px">${esc(D.TIERS[G.tier].blurb)}</p>${bars(G.stats)}<p class="small cen" style="margin:10px 0 0">Talent tier is fixed for the whole career. Re-roll only reshuffles your attributes.</p></div>
  <div class="card cen"><div class="small">You start out in</div><h2 style="margin:6px 0">${esc(C.name)}</h2><div class="small">${esc(G.team)} · seat funded by family · ${money(G.deal.cost)}/yr</div>
  <div class="row2" style="margin-top:14px"><button class="btn s" data-act="rs">🎲 Re-roll attributes</button><button class="btn s" data-act="rc">🔄 Re-roll club</button></div></div>
  <div class="fixed"><div><button class="btn g" data-act="begin">Begin Season 1</button></div></div>`;
}
function vSeason(){
  const S=G.S,C=CATS[S.cat],P=E.player(G),tb=E.standings(G),pos=tb.indexOf(P)+1;
  const logs=S.log.slice().reverse().map(l=>{
    const rs=l.out?`<span class="badge x">OUT</span>`:l.races.map(r=>`<span class="badge ${r.dnf?'x':r.pos===1?'w':r.pos<=3?'p':''}">${r.dnf?'DNF':'P'+r.pos}</span>`).join(' ');
    const d=l.out?'Missed through injury':`<b style="color:var(--tx)">Q P${l.qpos}</b>${l.pole?' 🏁 pole':''} · ${l.races.map(r=>`${esc(r.n)}: P${r.grid} → ${r.dnf?'DNF':'P'+r.pos}${r.dnf?'':' (+'+r.pts+')'}`).join(' · ')}${l.wet?' · 🌧️':''}`;
    return `<div class="log"><span class="r">R${l.round}</span><span class="t">${esc(l.name)}</span><span style="display:flex;gap:6px">${rs}</span><span class="d">${d}</span></div>`;}).join('');
  return `<button class="btn back" data-act="home">‹ Menu</button>
  <div class="tiles"><div class="tile"><span>${G.year}</span><b>${G.season}</b><i>age ${G.age}</i></div><div class="tile"><span>Round</span><b>${S.round}/${C.rounds}</b><i>${C.rpr} race${C.rpr>1?'s':''}/rd</i></div><div class="tile"><span>Wins</span><b>${P.w}</b><i>${P.p} podiums</i></div><div class="tile"><span>Points</span><b>${P.pts}</b><i>${P.pole} poles</i></div></div>
  <div class="chips"><span class="chip g"><b>${esc(G.team)}</b></span><span class="chip">${esc(C.short)}</span><span class="chip">Stage <b>${Math.min(3,S.spins+1)}/3</b></span><span class="chip">Pos <b>${S.round?pos:'-'}</b></span><span class="chip">Contract <b>${G.contract}yr</b></span>${G.academy?`<span class="chip">🎓 <b>${esc(G.academy.n.split(' ')[0]+' '+G.academy.n.split(' ')[1])}</b></span>`:''}</div>
  <div class="row2"><button class="btn" data-act="tbl">📊 Standings</button><button class="btn" data-act="drv">🧬 My driver</button></div>
  ${logs||'<p class="sub">Season ready. Hit race next round.</p>'}
  <div class="fixed"><div>${S.over?`<button class="btn g" data-act="wrap">Season wrap-up</button>`:`<button class="btn g" data-act="next">Race next round</button><button class="btn" data-act="sim">Sim to season end</button>`}</div></div>${modal()}`;
}
function vWrap(){
  const N=G.news,h=G.history[G.history.length-1],C=CATS[h.cat];
  const tro=h.trophies.length?h.trophies.map(t=>`<span class="rp">🏆 ${esc(t)}</span>`).join(''):'';
  return `<h1>Season ${h.season} wrap</h1><p class="sub">The paddock at a glance</p>
  <div class="card"><div class="lab">Your season</div><h2>${ord(h.pos)} of ${h.N} in ${esc(C.short)}</h2><div class="small">${esc(h.team)} · ${h.pts} pts · ${h.wins}W ${h.podiums}P ${h.poles} poles${h.earn?` · earned ${money(h.earn)}`:''}</div><div style="margin-top:8px">${tro}</div></div>
  ${N.msgs.map(m=>`<div class="note">${esc(m)}</div>`).join('')}
  <div class="card"><div class="lab">Champions around the world</div>${N.champs.map(c=>`<div class="news"><span>${esc(c.cat)}</span><span>${esc(c.who)}<br><small class="small">${esc(c.team)}</small></span></div>`).join('')}</div>
  <div class="card"><div class="lab">${esc(C.short)} · team power rankings</div>${N.rank.slice(0,10).map((t,i)=>`<div class="news"><span>${i+1}  <b style="color:var(--tx)">${esc(t.n)}</b></span><span>${t.r} <span class="${t.d>0?'up':t.d<0?'dn':''}">${t.d>0?'▲'+t.d:t.d<0?'▼'+Math.abs(t.d):'·'}</span></span></div>`).join('')}
  <div class="row2" style="margin-top:12px"><div><div class="lab">On the rise</div>${N.rising.map(t=>`<div>${esc(t.n)} <span class="up">▲${t.d}</span></div>`).join('')||'<span class="small">None</span>'}</div><div><div class="lab">Falling</div>${N.falling.map(t=>`<div>${esc(t.n)} <span class="dn">▼${Math.abs(t.d)}</span></div>`).join('')||'<span class="small">None</span>'}</div></div></div>
  <div class="card"><div class="lab">Championship top 10</div><div class="sc"><table>${N.table.map((d,i)=>`<tr class="${d.isPlayer?'me':''}"><td>${i+1}</td><td class="l">${esc(d.name)}<br><small class="small">${esc(d.team)}</small></td><td>${d.pts}</td></tr>`).join('')}</table></div></div>
  <div class="fixed"><div><button class="btn g" data-act="plan">Plan your next move</button></div></div>`;
}
function offerHtml(o,i){
  const C=CATS[o.cat],cur=G.tr[G.cat][G.team];
  const kind={stay:'Re-sign',promo:'Step up',move:'Sideways',lateral:'Lateral move'}[o.kind]||'';
  const d=o.cat===G.cat?Math.round(o.r-cur):null;
  const dl=d===null?(C.tier>CATS[G.cat].tier?'↑':'↔'):(d>0?'+'+d:d===0?'=':d);
  const pay=C.pay?`seat ${money(o.cost)}/yr${o.scholarship?' (scholarship)':''}`:`${money(o.sal)}/yr salary`;
  const lead=o.kind==='stay'?`Stay at ${esc(o.team)} ✓`:esc(o.team);
  return `<div class="opt ${ui.sel===i?'on':''}" data-act="sel" data-i="${i}"><b class="t">${lead}</b><span class="dl ${d!==null&&d<0?'n':''}">${dl}</span><span class="m">${esc(C.short)} · ${kind} · rating ${o.r} · ${pay} · ${o.years}yr</span><span class="ro">Your role: <span class="rp">${o.role}</span> · mate ${esc(o.tm)}</span></div>`;
}
function vMarket(){
  const M=G.market,last=G.history[G.history.length-1];
  const opts=M.options.map(offerHtml).join('');
  const ac=M.academy?`<div class="opt ${ui.acad?'on':''}" data-act="acad"><b class="t">🎓 ${esc(M.academy.n)}</b><span class="dl">${ui.acad?'✓':''}</span><span class="m">Academy offer. Costs covered in F4–F2, development boosts. Tap to accept.</span></div>`:'';
  const ret=`<div class="opt ${ui.sel==='ret'?'on':''}" data-act="sel" data-i="ret"><b class="t">🏁 Retire</b><span class="m">Hang up the helmet at ${G.age}. Career ends.</span></div>`;
  const tr=D.STATS.map(k=>`<div data-act="train" data-k="${k}" class="${ui.train===k?'on':''}">${k}<b>${G.stats[k]}</b></div>`).join('');
  const ok=ui.sel==='ret'||(ui.sel!==-1&&M.options[ui.sel]);
  return `<h1>Summer plans</h1><p class="sub">Season ${last.season} done. Choose your seat and sharpen an attribute.</p>
  <div class="card"><div class="lab">Transfer window · reputation ${Math.round(G.rep)} · ${G.contract>0?G.contract+'yr left on your deal':'contract expired'}</div>
  <div class="note" style="display:flex;justify-content:space-between"><span>💰 Career earnings</span><b class="gold">${money(G.tot.earn)}</b></div>
  <div class="small" style="margin-bottom:10px">Funding available for seats: <b style="color:var(--tx)">${money(E.funding(G))}</b>${G.academy?' · covered by academy':''}</div>
  ${M.note?`<div class="note">${esc(M.note)}</div>`:''}${ac}${opts}${M.stuck||M.forced||true?ret:''}</div>
  <div class="card"><div class="lab">Pre-season training · +2 to one attribute</div><div class="tg">${tr}</div></div>
  <div class="fixed"><div><button class="btn g" data-act="go" ${ok?'':'disabled'}>${ui.sel==='ret'?'Retire':'Start Season '+(G.season+1)}</button></div></div>`;
}
function vRetired(){
  const T=G.tot,R=G.retire,tr=Object.entries(T.trophies).sort((a,b)=>b[1]-a[1]);
  const cost=G.history.reduce((a,h)=>a+(h.cost||0),0);
  const b=R.best;
  return `${top()}<h1>${esc(G.name)} retires</h1><p class="sub">${R.age} years old · ${NATS[G.nat].f} ${esc(NATS[G.nat].n)} driver · ${R.seasons} seasons · ${R.label}</p><div class="cen" style="margin-bottom:12px">${tierBadge(G.tier)}</div>${R.cause?`<div class="note">${R.cause==='fatal'?'A tragic accident ended the career. The paddock mourns.':'A career-ending injury cut it short.'}</div>`:''}
  <div class="card"><div class="big">${T.wins}</div><div class="cen lab" style="font-size:15px;color:var(--tx)">Career wins</div>
  <div class="cen" style="font-size:42px;font-weight:900;color:var(--gd);margin:12px 0 2px">💰 ${money(T.earn)}</div><div class="cen lab">Career earnings</div>
  <div class="tro">${tr.map(([n,c])=>`<span>🏆 ${c}× ${esc(n)}</span>`).join('')||'<span>No major trophies</span>'}</div>
  <div class="box3"><div>Races<b>${T.races}</b></div><div>Podiums<b>${T.podiums}</b></div><div>Poles<b>${T.poles}</b></div></div>
  <div class="box3"><div>Titles<b>${Object.values(T.titles).reduce((a,x)=>a+x,0)}</b></div><div>Peak OVR<b>${T.peak}</b></div><div>Seat costs<b style="font-size:18px">${money(cost)}</b></div></div>
  ${G.standIns.length?`<p class="cen">F1 stand-ins: <b>${G.standIns.reduce((a,x)=>a+x.n,0)} starts, ${G.standIns.reduce((a,x)=>a+x.pts,0)} pts</b></p>`:''}<p class="cen">Teams: <b>${R.teams.map(esc).join(' · ')}</b></p>
  ${b?`<p class="cen">Best season: <b>${b.wins}W ${b.podiums}P</b> in ${esc(b.short)} for ${esc(b.team)}${b.champ?' 🏆':''}</p>`:''}</div>
  <div class="card"><div class="lab">Career progression</div><div class="sc"><table><tr><th>Year</th><th class="l">Series · Team</th><th>R</th><th>W</th><th>Pos</th></tr>${G.history.map(h=>`<tr><td>${h.year}${h.champ?' 🏆':''}<br><small class="small">age ${h.age}</small></td><td class="l">${esc(h.short)}<br><small class="small">${esc(h.team)}${h.trophies.length?' · '+esc(h.trophies.join(', ')):''}</small></td><td>${h.races}</td><td>${h.wins}</td><td>${h.pos}</td></tr>`).join('')}</table></div></div>
  <button class="btn g" data-act="again">Start a new career</button>`;
}

function pie(L){
  const tot=L.reduce((a,o)=>a+o.w,0);let a0=0;const R=100,cx=110,cy=110;
  const pt=d=>{const r=(d-90)*Math.PI/180;return [cx+R*Math.cos(r),cy+R*Math.sin(r)];};
  const sl=L.map(o=>{const a1=a0+o.w/tot*360;const [x0,y0]=pt(a0),[x1,y1]=pt(a1);o._mid=(a0+a1)/2;const big=a1-a0>180?1:0;const d=`M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${big} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`;a0=a1;return `<path d="${d}" fill="${o.col}" stroke="#0b0c14" stroke-width="1.5"/>`;}).join('');
  return `<svg viewBox="0 -14 220 234" class="pie"><g id="wg" style="transform-origin:110px 110px;transition:transform 1.6s cubic-bezier(.15,.7,.15,1)">${sl}</g><circle cx="110" cy="110" r="13" fill="#0b0c14" stroke="#2a2c4a"/><path d="M110,12 L99,-10 L121,-10 Z" fill="#fff"/></svg>`;
}
function modal(){
  const m=ui.modal; if(!m)return '';
  if(m==='tbl'){
    const tb=E.standings(G);const me=tb.findIndex(d=>d.isPlayer);const C=CATS[G.S.cat];
    const rows=tb.map((d,i)=>({d,i})).filter(x=>x.i<15||x.d.isPlayer);
    return `<div class="modalbg" data-act="close"><div class="modal" data-stop="1"><h2>${esc(C.name)}</h2><table><tr><th>Pos</th><th class="l">Driver</th><th>W</th><th>Pts</th></tr>${rows.map(({d,i})=>`<tr class="${d.isPlayer?'me':''} ${i<3?'z':''}"><td>${i+1}</td><td class="l">${esc(d.name)}<br><small class="small">${esc(d.team)}</small></td><td>${d.w}</td><td>${d.pts}</td></tr>`).join('')}</table><button class="btn g" style="margin-top:14px" data-act="close">Close</button></div></div>`;
  }
  if(m==='drv'){
    const C=CATS[G.cat];
    return `<div class="modalbg" data-act="close"><div class="modal" data-stop="1"><div class="pro"><div class="ovr">${E.ovrOf(G.stats)}<small>OVR</small></div><div><h3>${esc(G.name)}</h3><div class="small">age ${G.age} · ${esc(G.team)} · ${C.pay?money(G.deal.cost)+' seat':money(G.deal.sal)+'/yr'}</div>${tierBadge(G.tier)}</div></div>${bars(G.stats)}<button class="btn g" style="margin-top:14px" data-act="close">Close</button></div></div>`;
  }
  if(m==='wheel'){
    const r=ui.wheelRes, L=ui.wlist||[];
    const stageName=G.S.spins===0?'Early-season break':'Late-season break';
    if(r) return `<div class="modalbg"><div class="modal"><span class="wheel">${r.icon}</span><h2>${esc(r.title)}</h2><div class="fx"><b>What it does:</b> ${esc(r.fx)}</div><p class="sub" style="color:var(--tx)">${esc(r.desc)}</p><button class="btn g" data-act="wdone">Continue</button></div></div>`;
    const tot=L.reduce((a,o)=>a+o.w,0);
    return `<div class="modalbg"><div class="modal"><h2>🎡 ${stageName}</h2><p class="sub" style="margin-bottom:6px">Stage ${G.S.spins+1} of 3 done. Spin for a random twist, or play on.</p>${pie(L)}
    <button class="btn g" data-act="spin" ${ui.spin?'disabled':''}>Spin the wheel</button><button class="btn" data-act="skipw" ${ui.spin?'disabled':''}>Play on</button>
    <div class="lab" style="margin-top:6px">What each slice does</div><div class="lg">${L.map(o=>`<i style="background:${o.col}"></i><div><b>${o.ic} ${esc(o.t)} · ${(100*o.w/tot).toFixed(o.w<1?1:0)}%</b><span>${esc(o.fx)}</span></div>`).join('')}</div></div></div>`;
  }
  return '';
}

/* ---------- render / events ---------- */
function render(){
  let h='';
  const ph=G?G.phase:null;
  if(ui.screen==='start'||!G) h=vStart();
  else if(ph==='intro') h=vIntro();
  else if(ph==='season') h=vSeason();
  else if(ph==='wrap') h=vWrap();
  else if(ph==='market') h=vMarket();
  else if(ph==='retired') h=vRetired();
  $.innerHTML=h; window.scrollTo(0,0);
}
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y);}

function afterRound(){ if(G.S.wheelDue){ui.modal='wheel';ui.spin=null;ui.wheelRes=null;ui.wlist=E.wheelList(G);} }
document.addEventListener('input',e=>{if(e.target.id==='nm')ui.name=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='nat')ui.nat=e.target.value;});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  if(e.target.closest('[data-stop]') && el.classList.contains('modalbg'))return;
  const a=el.dataset.act;
  switch(a){
    case 'arch': ui.arch=el.dataset.v; rerender(); return;
    case 'sa': ui.startAge=+el.dataset.v; rerender(); return;
    case 'new': G=E.newGame({name:ui.name.trim()||'Driver',nat:ui.nat,arch:ui.arch,startAge:ui.startAge}); ui.screen='game'; ui.modal=null; save(); render(); return;
    case 'cont': G=load(); if(G){ui.screen='game';ui.modal=null; if(G.phase==='season')afterRound(); render();} return;
    case 'home': ui.screen='start'; ui.modal=null; render(); return;
    case 'rs': E.rerollStats(G); save(); rerender(); return;
    case 'rc': E.rerollClub(G); save(); rerender(); return;
    case 'begin': E.startSeason(G); save(); render(); return;
    case 'tbl': case 'drv': ui.modal=a; rerender(); return;
    case 'close': ui.modal=null; rerender(); return;
    case 'next': E.playRound(G); afterRound(); save(); render(); return;
    case 'sim': E.simToEnd(G); afterRound(); save(); render(); return;
    case 'spin': {
      const res=E.spinWheel(G); ui.spin=true; save(); rerender();
      const L=ui.wlist, mid=L[res.idx]._mid;
      setTimeout(()=>{const g=document.getElementById('wg'); if(g) g.style.transform='rotate('+(360*5-mid)+'deg)';},40);
      setTimeout(()=>{ui.wheelRes=res;ui.spin=null;rerender();},1800); return; }
    case 'skipw': E.skipWheel(G); ui.modal=null; save(); rerender(); return;
    case 'wdone': ui.modal=null; ui.wheelRes=null; if(G.pendingEnd){E.endCareerNow(G);save();render();return;} rerender(); return;
    case 'wrap': E.finishSeason(G); save(); render(); return;
    case 'plan': E.buildMarket(G); ui.sel=-1; ui.train=null; ui.acad=false; save(); render(); return;
    case 'sel': ui.sel=el.dataset.i==='ret'?'ret':+el.dataset.i; rerender(); return;
    case 'acad': ui.acad=!ui.acad; rerender(); return;
    case 'train': ui.train=ui.train===el.dataset.k?null:el.dataset.k; rerender(); return;
    case 'go':
      if(ui.sel==='ret'){E.retire(G);} else { E.chooseOption(G,ui.sel,ui.train,ui.acad); if(G.age>=E.MAX_AGE) E.retire(G); }
      ui.sel=-1; ui.train=null; ui.acad=false; save(); render(); return;
    case 'again': clear(); G=null; ui.screen='start'; render(); return;
  }
});
render();
})();
</script>
</body>
</html>
